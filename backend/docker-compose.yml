services:
  db:
    image: postgres:16-alpine
    container_name: sunmadhi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunmadhi_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sunmadhi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunmadhi_store"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sunmadhi_data:
