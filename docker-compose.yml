name: sunmadhi-store

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunmadhi_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - sunmadhi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunmadhi_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5055:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sunmadhi_store
      DB_SSL: "false"
      JWT_SECRET: "0bd01a692f3075ad7525f146caf5e3efaeb5cea41be08d2626d27e7768d61ea7"
      FRONTEND_ORIGIN: http://localhost:5055
      ADMIN_NAME: "Hari"
      ADMIN_EMAIL: "sunmadhistore@gmail.com"
      ADMIN_PASSWORD: "Sms@123456789"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  sunmadhi_data:
